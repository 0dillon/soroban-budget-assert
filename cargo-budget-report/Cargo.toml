[package]
name = "cargo-budget-report"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "cargo-budget-report"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cargo_metadata = "0.18"
clap = { version = "4", features = ["derive"] }
csv = "1"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stellar-xdr = "22.1.0"
tabled = "0.16"
toml = "0.8"
walkdir = "2"
wasmparser = "0.218"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
