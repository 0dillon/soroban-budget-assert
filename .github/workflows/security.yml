name: Security Audit (cargo-deny)

on:
  # Schedule: weekly scan catches advisories published against an unchanged
  # lockfile — the exact case Dependabot cannot catch while updates are muted.
  schedule:
    - cron: "23 6 * * 1"  # Monday 06:23 UTC
  push:
    branches: ["main"]
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/security.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/security.yml"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  cargo-deny:
    name: cargo-deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # cargo-deny-action v2 fetches its own Rust toolchain internally,
      # so we don't need a separate rust-toolchain install step.
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          log-level: warn
